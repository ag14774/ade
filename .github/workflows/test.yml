name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, current]
    runs-on: ${{ matrix.os }}
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - run: npm ci
      - run: npm run check
      - run: npx prettier --check "packages/*/src/**/*.ts" "packages/*/test/**/*.ts"
      - run: npm test
